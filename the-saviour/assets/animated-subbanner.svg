<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#052414" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02140a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D26A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D26A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes textCycle {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      22%, 25% { opacity: 0; transform: translateY(-8px); }
      26%, 95% { opacity: 0; transform: translateY(8px); }
      97%, 100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes textCycle2 {
      0%, 23% { opacity: 0; transform: translateY(8px); }
      26%, 46% { opacity: 1; transform: translateY(0px); }
      48%, 51% { opacity: 0; transform: translateY(-8px); }
      52%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes textCycle3 {
      0%, 48% { opacity: 0; transform: translateY(8px); }
      51%, 71% { opacity: 1; transform: translateY(0px); }
      73%, 76% { opacity: 0; transform: translateY(-8px); }
      77%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes textCycle4 {
      0%, 73% { opacity: 0; transform: translateY(8px); }
      76%, 96% { opacity: 1; transform: translateY(0px); }
      98%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 5; }
      50% { opacity: 0.3; r: 3.5; }
    }
    @keyframes scanLine {
      0% { transform: translateX(0); }
      100% { transform: translateX(760px); }
    }
    .msg1 { animation: textCycle 12s infinite ease-in-out; }
    .msg2 { animation: textCycle2 12s infinite ease-in-out; }
    .msg3 { animation: textCycle3 12s infinite ease-in-out; }
    .msg4 { animation: textCycle4 12s infinite ease-in-out; }
    .live-dot { animation: pulseDot 1.8s infinite ease-in-out; }
    .text-base {
      font-family: 'Fira Code', 'Segoe UI', monospace, system-ui;
      font-size: 16px;
      font-weight: 600;
      fill: #00E676;
    }
  </style>

  <!-- Card Background -->
  <rect x="10" y="10" width="780" height="80" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.8"/>

  <!-- Left Status Indicator -->
  <g transform="translate(36, 50)">
    <circle cx="0" cy="0" r="10" fill="#00D26A" fill-opacity="0.15" filter="url(#glow)"/>
    <circle class="live-dot" cx="0" cy="0" r="4.5" fill="#00FF88"/>
    <text x="18" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#88E5A8" letter-spacing="1.5">LIVE SYSTEM</text>
  </g>

  <!-- Divider -->
  <line x1="160" y1="28" x2="160" y2="72" stroke="#00D26A" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Animated Texts -->
  <g transform="translate(185, 55)">
    <text class="text-base msg1" x="0" y="0">🌲 Watching every leaf, every footprint — protecting wildlife 24/7</text>
    <text class="text-base msg2" x="0" y="0">🎯 98.4% Threat Detection Accuracy | Custom YOLOv8 Vision</text>
    <text class="text-base msg3" x="0" y="0">⚡ Sub-second WebSocket Alerts | Live Ranger GPS Dispatch</text>
    <text class="text-base msg4" x="0" y="0">🚨 Autonomous Poaching Prevention &amp; Incident Analytics</text>
  </g>
</svg>
